<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <style>
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #C9D1D9; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; fill: #7EE787; letter-spacing: 1px; }
    .box { fill: none; stroke: #2EA043; stroke-width: 1.5; rx: 12px; }
    
    /* Animação suave de Crossfade para as fotos */
    @keyframes fade {
      0%, 100% { opacity: 0; }
      10%, 40% { opacity: 0.20; }
      50% { opacity: 0; }
    }
    
    .dog1 { animation: fade 24s infinite; animation-delay: 0s; }
    .dog2 { animation: fade 24s infinite; animation-delay: 6s; }
    .dog3 { animation: fade 24s infinite; animation-delay: 12s; }
    .dog4 { animation: fade 24s infinite; animation-delay: 18s; }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate { animation: slideUp 0.8s ease-out forwards; }
  </style>

  <defs>
    <clipPath id="card-clip">
      <rect width="997" height="247" x="1.5" y="1.5" rx="12" />
    </clipPath>
  </defs>

  <!-- Fundo Sólido do Card -->
  <rect width="997" height="247" x="1.5" y="1.5" fill="#0D1117" rx="12" />

  <!-- Camada de Imagens Animadas -->
  <g clip-path="url(#card-clip)">
    <!-- COLE OS LINKS GERADOS PELO GITHUB NAS ISSUES AQUI -->
   <img width="520" height="1156" alt="Image" src="https://github.com/user-attachments/assets/8eed2c78-927c-4adf-bda5-2741d00a7967" preserveAspectRatio="xMidYMid slice" class="dog1" />
   <img width="720" height="1280" alt="Image" src="https://github.com/user-attachments/assets/80010ced-d44d-4965-8824-fb5b46845adb" preserveAspectRatio="xMidYMid slice" class="dog2" />
   <img width="868" height="1156" alt="Image" src="https://github.com/user-attachments/assets/f56793b0-1f16-4620-a2b5-0ffb83688f9b" preserveAspectRatio="xMidYMid slice" class="dog3" />
   <img width="868" height="1160" alt="Image" src="https://github.com/user-attachments/assets/4a7da543-4004-4c0e-a5d5-a096c3c0f1a9" preserveAspectRatio="xMidYMid slice" class="dog4" />

    <!-- Película escura para deixar a imagem de fundo discreta e não atrapalhar o texto -->
    <rect width="100%" height="100%" fill="#0D1117" opacity="0.85" />
  </g>

  <!-- Borda do Card -->
  <rect width="997" height="247" x="1.5" y="1.5" class="box" />

  <!-- Texto Principal -->
  <g class="animate" style="opacity: 0;">
    <text x="40" y="55" class="text title">▶ OBJETIVOS &amp; TRAJETÓRIA</text>
    
    <text x="40" y="100" class="text">Estudante técnico e desenvolvedor, sou fascinado por entender o que acontece por baixo</text>
    <text x="40" y="125" class="text">dos panos. Meu foco atual é criar sistemas robustos, integrando desde lógicas complexas</text>
    <text x="40" y="150" class="text">em C/C++ para microcontroladores até back-ends web escaláveis em Node.js.</text>
    
    <text x="40" y="185" class="text">Longe dos teclados, a rotina se divide entre os treinos na academia, a matemática e a</text>
    <text x="40" y="210" class="text">companhia das minhas maiores parceiras (as cachorrinhas que estão passando no fundo!).</text>
  </g>
</svg>
